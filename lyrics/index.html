<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>라이브 가사 변환기 - UmaConvert</title>
  <!-- 파비콘 · 폰트 · base.css는 _partials/head-common.html에서 빌드로 채웁니다. -->
  <!-- BUILD:START head-common.html -->
  <link rel="icon" type="image/png" href="/uma-convert/assets/img/favicon/favicon-96x96.png?v=20260923" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/uma-convert/assets/img/favicon/favicon.svg?v=20260923" />
  <link rel="shortcut icon" href="/uma-convert/assets/img/favicon/favicon.ico?v=20260923" />
  <link rel="apple-touch-icon" sizes="180x180" href="/uma-convert/assets/img/favicon/apple-touch-icon.png?v=20260923" />
  <meta name="apple-mobile-web-app-title" content="UmaConvert" />
  <link rel="manifest" href="/uma-convert/assets/img/favicon/site.webmanifest?v=20260923" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="../assets/css/base.css">
  <!-- BUILD:END -->
  <link rel="stylesheet" href="../assets/css/converter.css">
</head>
<body>
  <div class="page">
    <header>
      <nav class="crumbs" aria-label="현재 위치">
        <a href="../">UmaConvert</a>
        <span aria-hidden="true">/</span>
        <span>라이브 가사</span>
      </nav>
      <h1 class="page-title">라이브 가사 변환기</h1>
      <p class="lede">추출한 라이브 가사 파일을 시간표가 있는 읽기 쉬운 TXT로 바꿉니다.</p>
    </header>

    <div class="tabs" role="tablist" aria-label="작업 단계">
      <button class="tab" role="tab" id="tab-open" aria-controls="panel-open" aria-selected="true">파일 열기</button>
      <button class="tab" role="tab" id="tab-result" aria-controls="panel-result" aria-selected="false" disabled>결과</button>
    </div>

    <section class="tab-panel" id="panel-open" role="tabpanel" aria-labelledby="tab-open">
      <label class="dropzone" id="dropzone">
        <input type="file" id="file-input">
        <i class="mark tl"></i><i class="mark tr"></i><i class="mark bl"></i><i class="mark br"></i>
        <span class="dropzone-title">가사 파일을 여기에 끌어다 놓으세요</span>
        <span class="dropzone-sub">또는 이 영역을 눌러 파일을 고르세요</span>
        <span class="btn primary" aria-hidden="true">파일 선택</span>
      </label>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <p class="hint">m1029_lyrics처럼 확장자가 없는 추출 가사 파일을 사용합니다.<br>파일은 이 컴퓨터 안에서만 처리되고 어디로도 전송되지 않습니다.</p>
    </section>

    <section class="tab-panel" id="panel-result" role="tabpanel" aria-labelledby="tab-result" hidden>
      <div class="result-bar">
        <div>
          <h2 class="result-title" id="result-title"></h2>
          <p class="result-info" id="result-info"></p>
        </div>
        <div class="result-actions"><button class="btn primary" id="btn-txt" type="button">TXT 저장</button></div>
      </div>
      <pre class="lyrics-preview" id="lyrics-preview" aria-label="변환된 가사 미리보기"></pre>
    </section>
  </div>
  <script type="module" src="../assets/js/lyrics/main.js"></script>
</body>
</html>
