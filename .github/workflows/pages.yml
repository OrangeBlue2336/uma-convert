# main에 푸시할 때마다 node build.mjs를 실행하고, 그 결과를 GitHub Pages로 바로 배포합니다.
#
# 이 방식을 쓰려면 저장소 Settings -> Pages -> Build and deployment -> Source를
# "GitHub Actions"로 바꿔야 합니다. ("Deploy from a branch"에서 바꾸는 것입니다. 자세한 설명은
# README.md의 "커밋할 때마다 자동으로 배포하기" 참고.)
#
# 빌드와 배포를 같은 실행 안에서 끝내기 때문에, "빌드 결과를 다시 커밋해서 저장소에 남기는" 방식과
# 달리 별도 접근 토큰(personal access token)이 필요 없습니다. (GitHub이 기본으로 주는 토큰으로 다시
# 커밋을 하면 Pages가 그 커밋으로는 다시 빌드되지 않는 제약이 있어서, 그 방식은 일부러 쓰지 않았습니다.)

name: 빌드 후 GitHub Pages에 배포

on:
  push:
    branches: [main]
  workflow_dispatch: # 저장소의 Actions 탭에서 수동으로도 실행할 수 있게 합니다.

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 순서가 꼬일 수 있어, 앞선 배포가 끝날 때까지 새 배포를 기다리게 합니다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 공용 조각(_partials)을 각 페이지에 채워 넣기
        run: node build.mjs

      - name: Pages 배포 준비
        uses: actions/configure-pages@v5

      - name: 배포용 묶음 만들기
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: GitHub Pages에 배포
        id: deployment
        uses: actions/deploy-pages@v4
